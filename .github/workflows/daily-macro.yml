name: Refresh macro snapshot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macro-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_snapshot.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Commit updated snapshot
        run: |
          if git diff --quiet -- snapshot/macro-snapshot.json; then
            echo "No new macro observations."
            exit 0
          fi
          git config user.name "riskmode-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshot/macro-snapshot.json
          git commit -m "Update macro snapshot"
          git push
